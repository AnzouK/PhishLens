# =====================================================================
# PhishLens: local docker-compose
# =====================================================================
#  Usage:
#    1. Put the text model in ./model/ (one-time), for example:
#         huggingface-cli download AnzouKiona/phishlens-distilbert --local-dir model
#    2. docker compose up --build
#    3. chrome://extensions > Developer mode > Load unpacked > extension/,
#       then choose "Local backend (Docker)" in the PhishLens settings
# =====================================================================
services:
  phishlens-backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: phishlens-backend:latest
    container_name: phishlens-backend
    ports:
      - "8000:8000"
    volumes:
      # The text model, read-only.
      # The image reads it from /app/model (overridable via MODEL_DIR).
      - ./model:/app/model:ro
    environment:
      MODEL_DIR: /app/model
      # Another text model: download it first into ./model/<owner>--<name>
      # (the image works offline), then HF_MODEL_REPO=<owner>/<name> docker compose up
      HF_MODEL_REPO: ${HF_MODEL_REPO:-AnzouKiona/phishlens-distilbert}
      FEEDBACK_DIR: ${FEEDBACK_DIR:-}
      FEEDBACK_NOTIFY_URL: ${FEEDBACK_NOTIFY_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
