# =====================================================================
# PhishLens release
# =====================================================================
# On a version tag (v2.0.4...), or by hand from the Actions tab ("Run
# workflow", on main: the tag is made from the code's version): checks
# that the tag matches the version of the backend and the extension, zips
# extension/ and publishes the GitHub release with that zip and the
# version's CHANGELOG section. If the release already exists, only the
# zip is (re)attached.
# =====================================================================
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the code version
        run: |
          version=$(python3 scripts/check_version.py | awk '{print $2}')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "main" || { echo "run it on main"; exit 1; }
            echo "TAG=v$version" >> "$GITHUB_ENV"
          else
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, code $version"; exit 1; }
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extension zips (Chrome, Firefox)
        run: |
          python3 scripts/build_extension.py chrome "PhishLens-extension-$VERSION.zip"
          python3 scripts/build_extension.py firefox "PhishLens-firefox-$VERSION.zip"

      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $VERSION"; exit 1; }
          cat >> notes.md <<'TXT'

          ## Install

          Download `PhishLens-extension-VERSION.zip` below, unzip it, open `chrome://extensions`, turn on Developer mode and choose **Load unpacked** on the unzipped folder. Step by step: [user guide](https://github.com/AnzouK/PhishLens/wiki/Installation).

          `PhishLens-firefox-VERSION.zip` is the same add-on for Firefox 140 or later (`about:debugging`, This Firefox, Load Temporary Add-on, until it is on addons.mozilla.org).

          The zips hold only what the browser loads; the tests and the lint configuration are in the repository ([Source and tests](https://github.com/AnzouK/PhishLens#source-and-tests)).
          TXT
          sed -i "s/VERSION\.zip/$VERSION.zip/g; s/^          //" notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zips="PhishLens-extension-$VERSION.zip PhishLens-firefox-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $zips --clobber
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" $zips --title "PhishLens $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" $zips --title "PhishLens $VERSION" --notes-file notes.md --verify-tag
          fi
