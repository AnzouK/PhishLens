# =====================================================================
# PhishLens CI
# =====================================================================
# Runs on every push to main + every pull request.
#
#   1. Compile every backend Python file to catch SyntaxErrors
#   2. Lint the backend with ruff (fatal errors only — we're not enforcing
#      house style, just catching bugs like unused imports, undefined
#      names, syntax issues)
#   3. Run the backend/tests/ pytest suite — pure-function tests, no
#      model loading, no network, no heavy deps (torch/transformers/
#      pdfplumber are deliberately NOT installed here to keep runs
#      under a minute)
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint + test dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what auth_headers + attachment_analysis need at test time.
          # NB: no torch / transformers / pdfplumber — we keep CI fast by
          # not exercising the model path here.
          pip install pytest ruff beautifulsoup4

      - name: Compile every backend .py to catch SyntaxError
        run: python -m compileall -q backend/

      - name: Ruff (fatal errors only — E9, F63, F7, F82)
        run: |
          # Narrow rule set on purpose. We're not enforcing style here,
          # just catching things that would 500 the app: syntax errors
          # (E9), undefined names (F821, F823), assert on tuples (F631),
          # not-implemented tests (F811), etc.
          ruff check backend/ --select E9,F63,F7,F82 --output-format=github

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest tests/ -q --tb=short
