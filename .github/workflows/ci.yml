# =====================================================================
# PhishLens CI
# =====================================================================
# Runs on every push to main + every pull request.
#
#   1. Lint Python with ruff (only errors + a few high-signal warns)
#   2. Compile every Python file to catch SyntaxErrors on the whole tree
#   3. Run the backend/tests/ pytest suite (pure-function tests, no
#      model loading, no network)
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the pure-function tests need — we deliberately
          # skip torch / transformers / pdfplumber to keep CI fast.
          # attachment_analysis's PDF path is exercised end-to-end
          # from the extension; here we only run the HTML + dispatcher
          # tests which need beautifulsoup4.
          pip install pytest ruff beautifulsoup4

      - name: Ruff (lint, errors only)
        run: |
          ruff check backend/ --select E,F,W,B --ignore E501

      - name: Compile every .py to catch SyntaxError
        run: |
          python -m compileall -q backend/ extension/ site/ 2>/dev/null || true
          python -m compileall -q backend/

      - name: Run pytest
        working-directory: backend
        run: |
          # Explicitly point PYTHONPATH at backend/ so the tests can
          # import auth_headers and attachment_analysis without an
          # install step.
          PYTHONPATH=. pytest tests/ -q --tb=short
