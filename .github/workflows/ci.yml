# =====================================================================
# PhishLens CI
# =====================================================================
# Runs on every push to main + every pull request.
#
#   1. Compile every backend Python file to catch SyntaxErrors
#   2. Lint the backend with ruff (fatal errors only: we're not enforcing
#      house style, just catching bugs like unused imports, undefined
#      names, syntax issues)
#   3. Run the backend/tests/ pytest suite: pure-function tests, no
#      model loading, no network, no heavy deps (torch/transformers/
#      pdfplumber are deliberately NOT installed here to keep runs
#      under a minute)
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only reads the code, it never
# posts back to the repo (no PR comments, no status writes beyond what
# GH does automatically). CodeQL wants an explicit permissions block.
permissions:
  contents: read

jobs:
  # Chrome extension: syntax check every script with Node, then ESLint
  # (config in eslint.config.mjs: bug-class rules fail the job, hygiene
  # rules only annotate). No package.json on purpose, the extension has
  # no build step, so the linter is installed on the fly.
  extension:
    name: Extension lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax check (node --check)
        run: |
          for f in $(git ls-files 'extension/*.js'); do
            node --check "$f"
          done
      - name: ESLint
        run: |
          npm install --no-save --no-package-lock --silent eslint@9 globals@15
          npx eslint extension/

  # Resolves backend/requirements.txt on the same Python as the Docker
  # base image (python:3.11-slim) without installing anything. Catches
  # Dependabot bumps that CI would otherwise pass blindly because the
  # test job only installs a handful of packages (e.g. a numpy release
  # that no longer ships wheels for 3.11).
  requirements:
    name: Requirements resolve (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip resolve (dry run)
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --ignore-installed --quiet -r backend/requirements.txt

  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint + test dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the tests need. NB: no torch / transformers / lime /
          # pdfplumber. tests/conftest.py stubs the heavy imports and the
          # endpoint tests patch the text agent, so the model never loads.
          pip install pytest pytest-cov ruff beautifulsoup4 numpy \
                      fastapi httpx prometheus-fastapi-instrumentator

      - name: Compile every backend .py to catch SyntaxError
        run: python -m compileall -q backend/

      - name: Ruff, fatal errors only (E9, F63, F7, F82)
        run: |
          # Narrow rule set on purpose. We're not enforcing style here,
          # just catching things that would 500 the app: syntax errors
          # (E9), undefined names (F821, F823), assert on tuples (F631),
          # not-implemented tests (F811), etc.
          ruff check backend/ --select E9,F63,F7,F82 --output-format=github

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -q --tb=short \
            --cov=. --cov-config=.coveragerc \
            --cov-report=term-missing:skip-covered
