# =====================================================================
# PhishLens CI
# =====================================================================
# Runs on every push to main and every pull request.
#
#   extension     node --check, ESLint (every rule blocking) and the
#                 node:test unit tests of extension/lib
#   requirements  resolves backend/requirements.txt on the Docker base
#                 Python without installing anything
#   python        compile, ruff (lint + format, ruff.toml), version check
#                 and the offline pytest suite with coverage, 80% minimum
#                 (OCR, QR, Office, skops included; torch / transformers
#                 are stubbed, the model never loads)
#   ui            Playwright smoke tests of the popup (backend mocked)
#
# The first three are required by the branch protection rule on main.
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only reads the code.
permissions:
  contents: read

jobs:
  extension:
    name: Extension lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax check (node --check)
        run: |
          for f in $(git ls-files 'extension/*.js'); do
            node --check "$f"
          done
      - name: ESLint
        run: |
          npm install --no-save --no-package-lock --silent eslint@9 globals@15
          npx eslint extension/ --max-warnings 0
      - name: Unit tests (node:test)
        run: node --test tests/extension/*.test.js

  # Same Python as the Docker base image (python:3.12-slim). Catches
  # dependency bumps that cannot install in the image, which the test
  # job would not see because it installs only what the tests import.
  requirements:
    name: Requirements resolve (Docker Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip resolve (dry run)
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --ignore-installed --quiet -r backend/requirements.txt

  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (Tesseract OCR)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr libarchive-tools

      - name: Install lint + test dependencies
        run: |
          python -m pip install --upgrade pip
          # Everything the tests import, except torch / transformers /
          # lime: tests/conftest.py stubs those and the endpoint tests
          # patch the text agent, so the model never loads.
          pip install pytest pytest-cov "ruff==0.16.10" \
                      fastapi httpx prometheus-fastapi-instrumentator \
                      numpy pandas beautifulsoup4 pdfplumber pypdfium2 \
                      pillow pytesseract opencv-python-headless reportlab \
                      scikit-learn joblib skops rarfile py7zr defusedxml

      - name: Compile every backend .py to catch SyntaxError
        run: python -m compileall -q backend/

      - name: Ruff lint and format (ruff.toml)
        run: |
          ruff check backend/ scripts/ --output-format=github
          ruff format --check backend/ scripts/

      - name: Same version in the backend and the extension
        run: python scripts/check_version.py

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -q --tb=short \
            --cov=. --cov-config=.coveragerc \
            --cov-report=term-missing:skip-covered

  # Not required by branch protection yet: make it required once it has
  # been green for a while.
  ui:
    name: Popup UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock --silent @playwright/test@1
          npx playwright install --with-deps chromium
      - name: Run
        run: npx playwright test --config tests/ui/playwright.config.js
