# =====================================================================
# PhishLens: Dependabot version updates
# =====================================================================
# Dependabot alerts + security updates are managed in the repo Security
# settings (they run without a config file). This file adds weekly
# version-bump PRs for our declared dependencies. Grouped by ecosystem
# so we don't get 20 PRs on the same Monday morning.
#
# Docs: https://docs.github.com/en/code-security/dependabot
# =====================================================================
version: 2
updates:

  # Python backend: pip requirements
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: chore(deps)
      include: scope
    # Bundle patch + minor into one PR per group, keep major bumps in
    # their own PR (they usually need a manual look).
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        update-types: [patch, minor, major]
    # Torch is installed from the CPU-only PyPI index at Dockerfile
    # build time, not from requirements.txt: ignore it here.
    ignore:
      - dependency-name: torch
      - dependency-name: nvidia-*
      # Major versions of the model stack change loading APIs (e.g.
      # torch_dtype, snapshot_download arguments) and CI never loads the
      # real model, so a green CI proves nothing for them. Upgrade these
      # by hand after testing on a throwaway container.
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
      - dependency-name: huggingface_hub
        update-types: ["version-update:semver-major"]
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
      # The Random Forest joblibs are pickled: a scikit-learn major can
      # stop them from loading. Same rule.
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-major"]
      # pandas and numpy objects end up inside the pickled agents and in
      # their feature pipeline; a major version can change dtypes or break
      # unpickling. Same rule.
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Docker base images (python:3.11-slim in both Dockerfiles). Weekly
  # patch bumps catch upstream CVE fixes.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: chore(docker)
      include: scope
    # Keep patch bumps (3.11.x security fixes). A Python minor bump
    # (3.11 -> 3.14) changes which wheels exist for torch, lime and
    # scikit-image, and CI neither builds the image nor runs that
    # Python, so it is done by hand: build a test container, then move
    # the CI python-version to match.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
