<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="t d">
  <title id="t">PhishLens popup showing a phishing verdict</title>
  <desc id="d">The extension popup after scanning an email: phishing verdict, a score per agent with a bar, threat-intelligence badges and the words that influenced the text model.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ic { fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="400" height="600" rx="16" fill="#0e1117"/>

  <!-- header -->
  <image x="18" y="18" width="34" height="34" href="data:image/png;base64,"/>
  <text x="62" y="33" font-size="16" font-weight="700" fill="#f0f6fc">PhishLens</text>
  <text x="62" y="49" font-size="11.5" fill="#8b949e">Detect &amp; explain phishing emails</text>
  <g transform="translate(290 20)">
    <rect width="28" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <path class="ic" stroke="#8b949e" d="M8 20 V14 M14 20 V8 M20 20 V16"/>
  </g>
  <g transform="translate(324 20)">
    <rect width="28" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle class="ic" stroke="#8b949e" cx="14" cy="14" r="3.5"/><circle class="ic" stroke="#8b949e" cx="14" cy="14" r="7.5" stroke-dasharray="3 2.4"/>
  </g>
  <g transform="translate(358 20)">
    <rect width="28" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle class="ic" stroke="#8b949e" cx="14" cy="14" r="7"/><path d="M14 7 A7 7 0 0 0 14 21 Z" fill="#8b949e"/>
  </g>
  <rect x="0" y="66" width="400" height="1" fill="#21262d"/>

  <!-- verdict card -->
  <rect x="18" y="82" width="364" height="70" rx="14" fill="#2a1717" stroke="#f85149"/>
  <g transform="translate(34 100)" class="ic" stroke="#f85149" stroke-width="2.2"><path d="M15 2 L28 26 L2 26 Z"/><path d="M15 10 V17 M15 21 V21.3"/></g>
  <text x="78" y="112" font-size="15" font-weight="700" fill="#f0f6fc">This email looks like phishing</text>
  <text x="78" y="131" font-size="12" fill="#8b949e">We recommend not clicking any links.</text>

  <!-- agent rows -->
  <g transform="translate(18 166)">
    <rect width="364" height="70" rx="12" fill="#161b22" stroke="#21262d"/>
    <text x="14" y="24" font-size="13" font-weight="600" fill="#f0f6fc">Message content</text>
    <text x="350" y="24" font-size="13" font-weight="600" fill="#f85149" text-anchor="end">97%</text>
    <rect x="14" y="34" width="336" height="6" rx="3" fill="#21262d"/><rect x="14" y="34" width="326" height="6" rx="3" fill="#f85149"/>
    <text x="14" y="58" font-size="11.5" fill="#8b949e">The message content reads like a scam.</text>
  </g>
  <g transform="translate(18 244)">
    <rect width="364" height="70" rx="12" fill="#161b22" stroke="#21262d"/>
    <text x="14" y="24" font-size="13" font-weight="600" fill="#f0f6fc">Links in the email</text>
    <text x="350" y="24" font-size="13" font-weight="600" fill="#f85149" text-anchor="end">88%</text>
    <rect x="14" y="34" width="336" height="6" rx="3" fill="#21262d"/><rect x="14" y="34" width="296" height="6" rx="3" fill="#f85149"/>
    <rect x="14" y="46" width="186" height="18" rx="9" fill="#3a1a1a"/>
    <text x="24" y="59" font-size="10.5" font-weight="600" fill="#ff8f87">Flagged by Google Safe Browsing</text>
  </g>
  <g transform="translate(18 322)">
    <rect width="364" height="70" rx="12" fill="#161b22" stroke="#21262d"/>
    <text x="14" y="24" font-size="13" font-weight="600" fill="#f0f6fc">Sender &amp; headers</text>
    <text x="350" y="24" font-size="13" font-weight="600" fill="#d29922" text-anchor="end">64%</text>
    <rect x="14" y="34" width="336" height="6" rx="3" fill="#21262d"/><rect x="14" y="34" width="215" height="6" rx="3" fill="#d29922"/>
    <rect x="14" y="46" width="74" height="18" rx="9" fill="#3a1a1a"/>
    <text x="24" y="59" font-size="10.5" font-weight="600" fill="#ff8f87">DMARC fail</text>
    <rect x="94" y="46" width="64" height="18" rx="9" fill="#33290f"/>
    <text x="104" y="59" font-size="10.5" font-weight="600" fill="#e3b341">SPF fail</text>
  </g>

  <!-- why -->
  <g transform="translate(18 402)">
    <rect width="364" height="176" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="26" font-size="13" font-weight="600" fill="#f0f6fc">Why this verdict?</text>
    <path class="ic" stroke="#8b949e" d="M338 24 l5 -5 l5 5"/>
    <text x="14" y="50" font-size="11.5" fill="#8b949e">The words that influenced the text model most. A stronger</text>
    <text x="14" y="66" font-size="11.5" fill="#8b949e">colour means a stronger influence; orange points to phishing,</text>
    <text x="14" y="82" font-size="11.5" fill="#8b949e">green to safe.</text>
    <rect x="14" y="98" width="58" height="24" rx="6" fill="#6b2d14"/><text x="24" y="114" font-size="12" fill="#ffb199">verify</text>
    <rect x="78" y="98" width="86" height="24" rx="6" fill="#5c2913"/><text x="88" y="114" font-size="12" fill="#ffb199">suspended</text>
    <rect x="170" y="98" width="100" height="24" rx="6" fill="#4b2413"/><text x="180" y="114" font-size="12" fill="#ffb199">immediately</text>
    <rect x="276" y="98" width="72" height="24" rx="6" fill="#3d2013"/><text x="286" y="114" font-size="12" fill="#ffb199">account</text>
    <rect x="14" y="128" width="68" height="24" rx="6" fill="#3a1d13"/><text x="24" y="144" font-size="12" fill="#ffb199">payment</text>
    <rect x="88" y="128" width="54" height="24" rx="6" fill="#16301f"/><text x="98" y="144" font-size="12" fill="#7ee2a8">team</text>
    <rect x="148" y="128" width="64" height="24" rx="6" fill="#132a1c"/><text x="158" y="144" font-size="12" fill="#7ee2a8">agenda</text>
  </g>
</svg>
