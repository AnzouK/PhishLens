  <rect x="20" y="352" width="360" height="84" rx="4" fill="#1d2025" stroke="#2c3037"/>
  <text x="36" y="378" font-size="13.5" font-weight="600" fill="#e7e9ec">Sender &amp; headers</text>
  <text x="364" y="378" font-size="13.5" font-weight="700" fill="#e3b55b" text-anchor="end">64%</text>
  <rect x="36" y="388" width="328" height="5" rx="2.5" fill="#2c3037"/>
  <rect x="36" y="388" width="209" height="5" rx="2.5" fill="#e3b55b"/>
  <rect x="36" y="404" width="76" height="20" rx="4" fill="#433334"/>
  <text x="43" y="418" font-size="11" font-weight="600" fill="#f2877b">DMARC fail</text>
  <rect x="118.0" y="404" width="63" height="20" rx="4" fill="#413b2f"/>
  <text x="125.0" y="418" font-size="11" font-weight="600" fill="#e3b55b">SPF fail</text>

  <rect x="20" y="448" width="360" height="152" rx="4" fill="#1d2025" stroke="#2c3037"/>
  <text x="36" y="474" font-size="13.5" font-weight="600" fill="#e7e9ec">Why this verdict?</text>
  <path d="M356 470l5-5 5 5" class="ic" stroke="#a6acb5"/>
  <text x="36" y="496" font-size="11.5" fill="#a6acb5">The words that influenced the text model most.</text>
  <text x="36" y="512" font-size="11.5" fill="#a6acb5">Red points to phishing, green to safe.</text>
    <rect x="36" y="528" width="56" height="22" rx="4" fill="#925954"/>
  <text x="44" y="543" font-size="11.5" fill="#e7e9ec">verify</text>
  <rect x="98" y="528" width="75" height="22" rx="4" fill="#7d4e4c"/>
  <text x="106" y="543" font-size="11.5" fill="#e7e9ec">suspended</text>
  <rect x="179" y="528" width="89" height="22" rx="4" fill="#6e4746"/>
  <text x="187" y="543" font-size="11.5" fill="#e7e9ec">immediately</text>
  <rect x="274" y="528" width="62" height="22" rx="4" fill="#593d3d"/>
  <text x="282" y="543" font-size="11.5" fill="#e7e9ec">account</text>
  <rect x="36" y="556" width="62" height="22" rx="4" fill="#4c3738"/>
  <text x="44" y="571" font-size="11.5" fill="#e7e9ec">payment</text>
  <rect x="104" y="556" width="42" height="22" rx="4" fill="#365443"/>
  <text x="112" y="571" font-size="11.5" fill="#e7e9ec">team</text>
  <rect x="153" y="556" width="56" height="22" rx="4" fill="#2f463b"/>
  <text x="161" y="571" font-size="11.5" fill="#e7e9ec">agenda</text>
</svg>
