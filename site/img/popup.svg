    <rect x="348" y="20" width="30" height="30" rx="4" fill="none" stroke="#2c3037"/>
    <g transform="translate(354 26) scale(.75)" class="ic" stroke="#a6acb5" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="#a6acb5"/></g>
  </g>
  <line x1="0" y1="68" x2="400" y2="68" stroke="#2c3037"/>

  <rect x="20" y="84" width="360" height="62" rx="4" fill="#322a2e" stroke="#f2877b"/>
  <path transform="translate(38 101)" class="ic" stroke="#f2877b" d="M10.3 1.9L1.4 17a2 2 0 001.7 3h17.8a2 2 0 001.7-3L13.7 1.9a2 2 0 00-3.4 0zM12 8v4M12 16h.01" stroke-width="2"/>
  <text x="74" y="111" font-size="15" font-weight="700" fill="#e7e9ec">This email looks like phishing</text>
  <text x="74" y="130" font-size="12.5" fill="#a6acb5">We recommend not clicking any links.</text>

  <rect x="20" y="160" width="360" height="84" rx="4" fill="#1d2025" stroke="#2c3037"/>
  <text x="36" y="186" font-size="13.5" font-weight="600" fill="#e7e9ec">Message content</text>
  <text x="364" y="186" font-size="13.5" font-weight="700" fill="#f2877b" text-anchor="end">97%</text>
  <rect x="36" y="196" width="328" height="5" rx="2.5" fill="#2c3037"/>
  <rect x="36" y="196" width="316" height="5" rx="2.5" fill="#f2877b"/>
  <text x="36" y="226" font-size="12" fill="#a6acb5">The message content reads like a scam.</text>
  <rect x="20" y="256" width="360" height="84" rx="4" fill="#1d2025" stroke="#2c3037"/>
  <text x="36" y="282" font-size="13.5" font-weight="600" fill="#e7e9ec">Links in the email</text>
  <text x="364" y="282" font-size="13.5" font-weight="700" fill="#f2877b" text-anchor="end">88%</text>
  <rect x="36" y="292" width="328" height="5" rx="2.5" fill="#2c3037"/>
  <rect x="36" y="292" width="287" height="5" rx="2.5" fill="#f2877b"/>
  <rect x="36" y="308" width="208" height="20" rx="4" fill="#433334"/>
