<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620" role="img" aria-labelledby="t d">
  <title id="t">PhishLens popup showing a phishing verdict</title>
  <desc id="d">The extension popup after scanning an email: a phishing verdict, a score per check with a bar, threat-intelligence and authentication badges, and the words that influenced the text model.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ic { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="0.5" y="0.5" width="399" height="619" rx="6" fill="#16181c" stroke="#2c3037"/>

  <image x="20" y="18" width="34" height="34" href="data:image/png;base64,"/>
  <text x="64" y="34" font-size="16" font-weight="700" fill="#e7e9ec">PhishLens</text>
  <text x="64" y="51" font-size="12" fill="#a6acb5">Detect &amp; explain phishing emails</text>
  <g>
    <rect x="276" y="20" width="30" height="30" rx="4" fill="none" stroke="#2c3037"/>
    <g transform="translate(282 26) scale(.75)" class="ic" stroke="#a6acb5" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></g>
